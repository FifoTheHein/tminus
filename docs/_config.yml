# GitHub Pages builds docs/ as the site. Only the home page (with its fonts, the
# app icon and the screenshots), the privacy policy and the demo feed are public,
# so every other path is kept out of the site.
exclude:
  - design
  - design-brief.md
  - play/declarations.md
  - play/feature-graphic.png
  - play/listing.md
  - play/release.md
  - superpowers
