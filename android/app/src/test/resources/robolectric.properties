# Robolectric runs SDK 35+ only on Java 21. Flutter builds with the JDK from
# `flutter config --jdk-dir` (JBR 17 on this machine) while ./gradlew uses JAVA_HOME,
# so pin 34 to run the same way on either JDK.
sdk=34
# Every test runs with an AlarmCalls executor that calls each block on the test's own thread.
application=io.github.fifothehein.tminus.TestTMinusApplication
